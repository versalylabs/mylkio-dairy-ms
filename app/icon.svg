  <path d="M13.5 14.5 C12.6 16.5 12.6 18.5 13 20" stroke="#CBDBCF" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Gold dairy accent leaf/splash -->
  <path d="M16 23 C18 23 20 21.5 20.5 19 C21.5 21 20 23.5 17 24.5 C16.5 24.2 16.2 23.5 16 23 Z" fill="url(#goldGrad)" />
  
  <!-- Premium quality star accent -->
